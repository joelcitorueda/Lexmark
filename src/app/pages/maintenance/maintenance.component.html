        <path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-3-3 2.5-2.5Z" />
      </svg>
    </div>
    <p class="maintenance-page__eyebrow">{{ copy().eyebrow }}</p>
    <h1>{{ copy().title }}</h1>
    <p class="maintenance-page__body">{{ copy().body }}</p>
    <a routerLink="/" class="maintenance-page__back">{{ copy().back }}</a>
  </div>
</section>
